# A template. Do not fill this in and commit it: a Secret stores base64, which is
# encoding, not encryption, and anyone with the file has the key.
#
# Create the real one from your .env instead:
#
#   PW=$(grep NEO4J_PASSWORD graph-pipeline/.env | cut -d= -f2)
#   kubectl create secret generic arxiv-lens-secrets -n arxiv-lens \
#     --from-literal=ANTHROPIC_API_KEY="$(grep ANTHROPIC_API_KEY graph-pipeline/.env | cut -d= -f2)" \
#     --from-literal=NEO4J_PASSWORD="$PW" \
#     --from-literal=NEO4J_AUTH="neo4j/$PW"
#
# NEO4J_AUTH is the single string the Neo4j image wants ("user/password"), while
# NEO4J_PASSWORD is what the Python driver reads. Same secret, two shapes.
apiVersion: v1
kind: Secret
metadata:
  name: arxiv-lens-secrets
  namespace: arxiv-lens
type: Opaque
stringData:
  ANTHROPIC_API_KEY: replace-me
  NEO4J_PASSWORD: replace-me
  NEO4J_AUTH: neo4j/replace-me

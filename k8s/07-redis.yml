apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: arxiv-lens
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# The L2 cache behind query-service's Caffeine L1. No volume, as in compose:
# losing it on a restart costs cache misses, never data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: arxiv-lens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            # Above maxmemory: that caps the dataset, not the process.
            limits:
              memory: 320Mi
              cpu: 500m

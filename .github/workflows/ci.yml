name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph-pipeline:
    name: graph-pipeline (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: graph-pipeline/requirements-dev.txt

      # CPU torch first, from its own index, exactly as graph-pipeline/Dockerfile
      # does it. The default PyPI wheel for Linux pulls the CUDA runtime — some
      # 3 GB of GPU libraries that no runner and no image here can use.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # Then the full dependency set, not a trimmed one: a CI that installs less
      # than the project declares can pass while the project is uninstallable.
      - run: pip install -r requirements-dev.txt

      - run: ruff check pipeline retrieval eval tests

      - run: pytest -q

  query-service:
    name: query-service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: query-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The Kafka listener test runs an in-process broker and the gRPC adapter
      # test an in-process server, so no service containers are needed.
      - run: ./gradlew test --no-daemon

  # Only a commit on main whose tests passed becomes an image. Built here rather
  # than on a laptop so the images are amd64, which is what cloud machines run.
  images:
    name: images (${{ matrix.service }})
    needs: [graph-pipeline, query-service]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [graph-pipeline, query-service]
    steps:
      - uses: actions/checkout@v7

      # Registry paths must be lowercase; the account name is not.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/arxiv-lens-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      # Both Dockerfiles build from the repo root because they share proto/.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

limit_req_zone $binary_remote_addr zone=ask_ip:10m rate=6r/m;
limit_req_zone $server_name        zone=ask_all:1m rate=60r/m;

server {
    listen 80;
    server_name arxiv-lens-dat.duckdns.org lens.nguyentiendat.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://lens.nguyentiendat.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lens.nguyentiendat.dev;

    ssl_certificate     /etc/letsencrypt/live/lens.nguyentiendat.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lens.nguyentiendat.dev/privkey.pem;

    # A literal proxy_pass host is resolved once at startup, so a recreated
    # query-service (new IP) gets 502s until a reload; a variable is resolved
    # per request through Docker's DNS.
    resolver 127.0.0.11 valid=10s;
    set $query_service http://query-service:8082;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/query {
        limit_req zone=ask_ip burst=5 nodelay;
        limit_req zone=ask_all burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $query_service;
    }

    location / {
        proxy_pass $query_service;
    }
}

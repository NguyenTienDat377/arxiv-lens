name: arxiv-lens

services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt, what the drivers speak
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}"
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9094:9094"   # 9092 is taken by another project on this machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two listeners: containers reach the broker as kafka:9092, processes on
      # the host reach it as localhost:9094. A client is told the address for
      # the listener it connected on, so both work without reconfiguration.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # The image defaults to /tmp/kraft-combined-logs, so without this the
      # volume below mounts a directory the broker never writes to.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Both application services sit behind a profile, so `docker compose up` still
  # starts infrastructure only and the host dev loop is unchanged. The full
  # containerised stack is `docker compose --profile app up --build`.
  graph-pipeline:
    build:
      # The repo root, because the build needs proto/ as well as the service.
      context: ..
      dockerfile: graph-pipeline/Dockerfile
    container_name: graph-pipeline
    profiles: [app]
    restart: unless-stopped
    ports:
      - "50051:50051"
    # Supplies ANTHROPIC_API_KEY, which the answer step needs. Only this service
    # gets it: neo4j and kafka have no use for the key.
    env_file:
      - ../graph-pipeline/.env
    environment:
      # `environment` wins over `env_file`, which matters here — the .env file
      # says localhost, and inside a container localhost is the container.
      NEO4J_URL: bolt://neo4j:7687
      KAFKA_BOOTSTRAP: kafka:9092
      HF_HUB_OFFLINE: "1"   # the model is baked in; never reach the hub at runtime
    volumes:
      # Snapshots, extractions and embeddings belong on the host, not in a layer.
      - ../graph-pipeline/data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost', 50051), 2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  query-service:
    build:
      context: ..
      dockerfile: query-service/Dockerfile
    container_name: query-service
    profiles: [app]
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      GRPC_TARGET: static://graph-pipeline:50051
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      graph-pipeline:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL",
             "curl -sf http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
    # Pinned to the volume the hand-run container already used, so switching to
    # compose keeps the existing graph instead of starting from empty.
    name: arxiv_lens_neo4j_data
  kafka_data:
    name: arxiv_lens_kafka_data

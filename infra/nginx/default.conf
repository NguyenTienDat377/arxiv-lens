server {
    listen 80;
    server_name arxiv-lens-dat.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name arxiv-lens-dat.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/arxiv-lens-dat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arxiv-lens-dat.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://query-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
